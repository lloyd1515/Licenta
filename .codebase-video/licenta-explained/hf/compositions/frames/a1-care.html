<template>
  <style>
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1420;
      color: #eef1f7;
      font-family: "Inter", sans-serif;
    }
    .ca-ground { position: absolute; inset: 0; background: #0f1420; }
    .ca-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ca-cross { fill: none; stroke: #f5c16c; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1 1; }
    .ca-q-wrap { position: absolute; inset: 0; }
    .ca-q {
      position: absolute;
      left: 0;
      right: 0;
      top: 900px;
      text-align: center;
      font-weight: 700;
      font-size: 88px;
      color: #eef1f7;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="a1-care" data-start="0" data-duration="13.5" data-width="1920" data-height="1080">
    <div id="ca-ground" class="clip ca-ground" data-start="0" data-duration="13.5" data-track-index="0"></div>

    <svg id="ca-scene" class="clip ca-scene" data-start="0" data-duration="13.5" data-track-index="1" viewBox="0 0 1920 1080" width="1920" height="1080">
      <g id="ca-content">
        <!-- floor line -->
        <line x1="80" y1="860" x2="1840" y2="860" stroke="#2a3448" stroke-width="4"/>

        <!-- house outline -->
        <g id="ca-house">
          <polygon points="480,430 960,230 1440,430" fill="#182133" stroke="#a9b3c6" stroke-width="6" stroke-linejoin="round"/>
          <rect x="520" y="430" width="880" height="430" fill="#151d2d" stroke="#a9b3c6" stroke-width="6"/>
          <rect x="880" y="690" width="80" height="170" fill="none" stroke="#5d6a82" stroke-width="4"/>
        </g>

        <!-- phone far right inside the house -->
        <g id="ca-phone" opacity="0">
          <rect x="1240" y="720" width="80" height="130" rx="14" fill="#182133" stroke="#8ab8ff" stroke-width="5"/>
          <rect x="1252" y="738" width="56" height="90" rx="6" fill="#8ab8ff" opacity="0.35"/>
        </g>

        <!-- distance arrow -->
        <g id="ca-reach" opacity="0">
          <line x1="680" y1="640" x2="1200" y2="640" stroke="#a9b3c6" stroke-width="4" stroke-dasharray="14 12"/>
          <path d="M1200,640 L1182,628 M1200,640 L1182,652" stroke="#a9b3c6" stroke-width="4" fill="none" stroke-linecap="round"/>
          <text x="940" y="600" text-anchor="middle" font-family="Inter" font-weight="700" font-size="52" fill="#eef1f7">out of reach</text>
        </g>

        <!-- figure with walking stick: feet at (0,0), placed with gsap.set at x 600, y 860 -->
        <g id="ca-fig-pos" transform="translate(600,860)">
          <g id="ca-fig" fill="none" stroke="#eef1f7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="0" cy="-200" r="28"/>
            <path d="M0,-170 L0,-80 M0,-150 L-26,-100 M0,-150 L26,-100 M0,-80 L-22,0 M0,-80 L22,0"/>
            <path d="M26,-100 L44,0" stroke="#a9b3c6" stroke-width="6"/>
          </g>
          <g id="ca-lie" opacity="0" fill="none" stroke="#eef1f7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M40,-14 L176,-14 M40,-14 L6,-2 M40,-14 L14,0 M112,-14 L96,-3 M112,-14 L128,-2"/>
            <circle cx="202" cy="-14" r="26"/>
          </g>
        </g>
      </g>

      <!-- card 1: cameras feel like spying -->
      <g id="ca-card1" opacity="0">
        <rect x="80" y="300" width="360" height="260" rx="16" fill="#182133" stroke="#2a3448" stroke-width="3"/>
        <g fill="none" stroke="#a9b3c6" stroke-width="5" stroke-linejoin="round">
          <rect x="210" y="380" width="100" height="50" rx="8"/>
          <path d="M234,380 L240,368 L280,368 L286,380"/>
          <circle cx="260" cy="405" r="14"/>
        </g>
        <text x="260" y="500" text-anchor="middle" font-family="Inter" font-weight="400" font-size="48" fill="#a9b3c6">feels like</text>
        <text x="260" y="556" text-anchor="middle" font-family="Inter" font-weight="400" font-size="48" fill="#a9b3c6">spying</text>
        <path id="ca-x1" class="ca-cross" pathLength="1" d="M352,322 L400,370 M400,322 L352,370"/>
      </g>

      <!-- card 2: wristband left on the nightstand -->
      <g id="ca-card2" opacity="0">
        <rect x="1480" y="300" width="360" height="260" rx="16" fill="#182133" stroke="#2a3448" stroke-width="3"/>
        <ellipse cx="1660" cy="390" rx="50" ry="22" fill="none" stroke="#a9b3c6" stroke-width="6"/>
        <rect x="1650" y="380" width="20" height="26" fill="#a9b3c6"/>
        <rect x="1610" y="430" width="100" height="50" fill="#151d2d" stroke="#5d6a82" stroke-width="4"/>
        <line x1="1610" y1="455" x2="1710" y2="455" stroke="#5d6a82" stroke-width="3"/>
        <text x="1660" y="516" text-anchor="middle" font-family="Inter" font-weight="400" font-size="48" fill="#a9b3c6">left behind</text>
        <path id="ca-x2" class="ca-cross" pathLength="1" d="M1752,322 L1800,370 M1800,322 L1752,370"/>
      </g>

      <!-- glow on the house (drawn above the dimmed content) -->
      <defs>
        <filter id="ca-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
      </defs>
      <g id="ca-glow" opacity="0" filter="url(#ca-blur)" fill="none" stroke="#8ab8ff" stroke-width="30" stroke-linejoin="round">
        <polygon points="480,430 960,230 1440,430"/>
        <rect x="520" y="430" width="880" height="430"/>
      </g>
    </svg>

    <div id="ca-q-layer" class="clip ca-q-wrap" data-start="0" data-duration="13.5" data-track-index="2">
      <div id="ca-q" class="ca-q">Can the room notice the fall?</div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 13.5;
      var tl = gsap.timeline({ paused: true });

      // Initial placement (not timed): figure stands inside the house.
      gsap.set("#ca-q", { opacity: 0 });

      // S0 (0.2 s): house fades in; figure stands with stick.
      tl.fromTo("#ca-house", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);

      // S1 (2.86 s): figure falls toward the far side, 0.8 s ease-in.
      tl.to("#ca-fig", { rotation: 90, svgOrigin: "0 0", duration: 0.8, ease: "power2.in" }, 2.9);
      tl.set("#ca-fig", { opacity: 0 }, 3.7);
      tl.set("#ca-lie", { opacity: 1 }, 3.7);
      // phone and distance arrow appear on "the phone is across the room" (~4.1 s).
      tl.fromTo("#ca-phone", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.1);
      tl.fromTo("#ca-reach", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.3);

      // S2 (5.56 s): camera card slides in from the left; amber cross over it.
      tl.fromTo("#ca-card1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 5.56);
      tl.fromTo("#ca-x1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 6.3);
      // wristband card slides in from the right on "wristband" (~7.4 s); amber cross.
      tl.fromTo("#ca-card2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 7.4);
      tl.fromTo("#ca-x2", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 8.6);

      // S3 (9.86 s): everything dims, house glows accent blue, question appears (~11.6 s).
      tl.to("#ca-content", { opacity: 0.25, duration: 0.8, ease: "power2.inOut" }, 9.86);
      tl.fromTo("#ca-glow", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 10.2);
      tl.fromTo("#ca-q", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.6);

      // Pin to the full scene length (hold, no exit animation).
      tl.to({}, { duration: DUR }, 0);

      window.__timelines["a1-care"] = tl;
    })();
  </script>
</template>
