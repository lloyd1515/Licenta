<template>
  <style>
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "JetBrains Mono"; src: url("../../assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }

    #a1-stations {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", system-ui, sans-serif;
      color: #eef1f7;
    }
    #a1-stations .a1s-ground { position: absolute; inset: 0; background: #0f1420; }
    #a1s-stage { position: absolute; inset: 0; }

    #a1-stations .a1s-wave { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #a1-stations .a1s-bar {
      position: absolute;
      top: 390px;
      width: 14px;
      height: 300px;
      border-radius: 7px;
      background: #8ab8ff;
    }
    #a1-stations .a1s-label {
      position: absolute;
      left: 0;
      top: 150px;
      width: 1920px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      opacity: 0;
    }
    #a1-stations .a1s-label .a1s-accent { color: #8ab8ff; }
    #a1-stations .a1s-msg {
      position: absolute;
      left: 948px;
      top: 300px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #7fd6e6;
      box-shadow: 0 0 18px rgba(127, 214, 230, 0.6);
      opacity: 0;
    }
    #a1-stations .a1s-count {
      position: absolute;
      left: 0;
      top: 730px;
      width: 1920px;
      text-align: center;
      font-size: 64px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
    }
    #a1-stations .a1s-count .a1s-num { color: #8ab8ff; font-variant-numeric: tabular-nums; }
    #a1-stations .a1s-mono {
      position: absolute;
      left: 0;
      top: 830px;
      width: 1920px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 44px;
      color: #a9b3c6;
      white-space: nowrap;
      opacity: 0;
    }
    #a1-stations .a1s-term {
      position: absolute;
      left: 410px;
      top: 790px;
      width: 1100px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #182133;
      border: 1px solid #2a3448;
      border-radius: 16px;
      font-size: 52px;
      white-space: nowrap;
      opacity: 0;
    }
    #a1-stations .a1s-term .a1s-key { font-family: "JetBrains Mono", monospace; color: #8ab8ff; margin-right: 18px; }
  </style>

  <div id="a1-stations" data-composition-id="a1-stations" data-start="0" data-duration="21.6" data-width="1920" data-height="1080">
    <div id="a1s-ground" class="clip a1s-ground" data-start="0" data-duration="21.6" data-track-index="0"></div>

    <div id="a1s-stage" class="clip" data-start="0" data-duration="21.6" data-track-index="1">
      <svg class="a1s-wave" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="a1s-wave-path" pathLength="1" d="" fill="none" stroke="#8ab8ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"></path>
      </svg>

      <div class="a1s-label" id="a1s-label">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="none" stroke="#8ab8ff" stroke-width="4"></circle>
          <line x1="32" y1="32" x2="50" y2="18" stroke="#8ab8ff" stroke-width="4" stroke-linecap="round"></line>
        </svg>
        <span><span class="a1s-accent">52</span> stations</span>
      </div>

      <div class="a1s-msg" id="a1s-msg"></div>

      <div class="a1s-count" id="a1s-count">≈ <span class="a1s-num" id="a1s-num">0</span> messages / second</div>
      <div class="a1s-mono" id="a1s-mono">52 numbers × 33 per second</div>

      <div class="a1s-term" id="a1s-term"><span class="a1s-key">subcarrier</span> = one narrow wave (one station)</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("a1-stations");
      var stage = document.getElementById("a1s-stage");
      var NUM = 52;
      var LEFT = 160;
      var WIDTH = 1600;
      var PITCH = WIDTH / NUM;
      var BAR_W = 14;
      var HIGHLIGHT = 26;

      // Seeded LCG so every render and seek produces the same numbers.
      function lcg(seed) {
        var s = seed;
        return function () {
          s = (s * 1664525 + 1013904223) % 4294967296;
          return s / 4294967296;
        };
      }
      var rnd = lcg(20260714);
      function profile() {
        var out = [];
        for (var i = 0; i < NUM; i++) out.push(0.18 + rnd() * 0.82);
        return out;
      }
      var profA = profile();
      var profB = profile();
      var cycles = [profile(), profile(), profile(), profile(), profile(), profile()];

      // Build bars.
      var bars = [];
      for (var i = 0; i < NUM; i++) {
        var bar = document.createElement("div");
        bar.className = "a1s-bar";
        bar.style.left = (LEFT + i * PITCH + (PITCH - BAR_W) / 2).toFixed(2) + "px";
        stage.appendChild(bar);
        bars.push(bar);
      }

      // Build the single fat wave path (one sine-like line across the frame).
      var wavePath = document.getElementById("a1s-wave-path");
      var d = "";
      for (var x = LEFT; x <= LEFT + WIDTH; x += 8) {
        var y = 540 - 110 * Math.sin((2 * Math.PI * (x - LEFT)) / 420);
        d += (d === "" ? "M" : "L") + x + " " + y.toFixed(1) + " ";
      }
      wavePath.setAttribute("d", d);

      function scaleFn(prof) {
        return function (idx) { return prof[idx]; };
      }

      var label = document.getElementById("a1s-label");
      var msg = document.getElementById("a1s-msg");
      var count = document.getElementById("a1s-count");
      var mono = document.getElementById("a1s-mono");
      var num = document.getElementById("a1s-num");
      var term = document.getElementById("a1s-term");
      var counter = { v: 0 };

      var tl = gsap.timeline({ paused: true });

      gsap.set(bars, { scaleY: 0, transformOrigin: "50% 50%" });

      // S0 (0.2 s): one fat wave draws across.
      tl.fromTo(wavePath, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.2);

      // S1 (2.41 s): the wave splits into 52 narrow bars.
      tl.to(wavePath, { opacity: 0, duration: 0.4, ease: "power1.out" }, 2.3);
      tl.fromTo(bars, { scaleY: 0 }, { scaleY: scaleFn(profA), duration: 0.6, ease: "power3.out", stagger: { each: 0.02, from: "center" } }, 2.5);
      tl.fromTo(label, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.9);

      // S2 (7.7 s): a message arrives; bars re-settle to a new loudness pattern.
      tl.fromTo(msg, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 7.9);
      tl.to(msg, { y: 70, opacity: 0, duration: 0.5, ease: "power1.in" }, 8.3);
      tl.to(bars, { scaleY: scaleFn(profB), duration: 0.7, ease: "power2.inOut", stagger: { each: 0.012, from: "start" } }, 8.6);

      // S3 (11.98 s): bars keep changing; counter ticks to 33; mono row.
      tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 12.2);
      tl.fromTo(mono, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 12.4);
      tl.to(counter, {
        v: 33,
        duration: 3.0,
        ease: "power1.out",
        onUpdate: function () { num.textContent = String(Math.round(counter.v)); }
      }, 12.4);
      for (var k = 0; k < cycles.length; k++) {
        tl.to(bars, { scaleY: scaleFn(cycles[k]), duration: 0.25, ease: "none" }, 12.3 + k * 0.5);
      }

      // S4 (18.65 s): one bar is the subcarrier; the rest dim; term card.
      tl.to([count, mono], { opacity: 0, duration: 0.3, ease: "power1.in" }, 18.5);
      tl.to(bars, { backgroundColor: "#3a4860", duration: 0.5, ease: "power1.out" }, 18.7);
      tl.to(bars[HIGHLIGHT], { backgroundColor: "#7fd6e6", duration: 0.5, ease: "power1.out" }, 18.7);
      tl.fromTo(term, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 18.9);

      // Hold to the end of the scene.
      tl.to({}, { duration: 21.6 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["a1-stations"] = tl;
    })();
  </script>
</template>
