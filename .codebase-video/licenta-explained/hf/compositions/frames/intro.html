    <svg id="in-scene" class="clip in-scene" data-start="0" data-duration="12.1" data-track-index="1" viewBox="0 0 1920 1080" width="1920" height="1080">

      <polygon points="300,150 600,200 600,800 300,850" fill="#131b2b" stroke="#2a3448" stroke-width="3"/>

  <script>
    (function () {
      var DUR = 12.033;
      var tl = gsap.timeline({ paused: true });

      // Initial placement (not timed): figure stands mid-room, banner parked above the frame.
      gsap.set("#in-banner", { y: -260 });
      gsap.set("#in-code", { opacity: 0 });

      // Arcs breathe all the time (finite yoyo, 12 s).
      tl.to("#in-arcs-pulse", { opacity: 0.85, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0);

      // S0 (0.2 s): figure tips over and lies flat, 0.8 s ease-in. Arcs wobble at the moment of the fall.
      tl.to("#in-fig", { rotation: 90, svgOrigin: "0 0", duration: 0.7, ease: "power2.in" }, 0.8);
      tl.set("#in-fig", { opacity: 0 }, 1.5);
      tl.set("#in-lie", { opacity: 1 }, 1.5);
      tl.to("#in-arcs", { x: 14, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, 1.2);

      // S1 (2.22 s): camera card enters, red cross draws over it.
      tl.fromTo("#in-cam", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.22);
      tl.fromTo("#in-cam-x", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.8);

      // S2 (3.84 s): wristband card enters, cross draws over it.
      tl.fromTo("#in-wrist", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.84);
      tl.fromTo("#in-wrist-x", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 4.4);

      // S3 (5.62 s): arcs flash accent blue, "Wi-Fi" label appears, then settle back to violet.
      tl.to(".in-arc", { stroke: "#8ab8ff", duration: 0.15, ease: "none" }, 5.62);
      tl.to(".in-arc", { stroke: "#c3b1f2", duration: 0.9, ease: "power2.out" }, 6.4);
      tl.fromTo("#in-wifi", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.8);
      tl.to("#in-wifi", { opacity: 0, duration: 0.3, ease: "power1.out" }, 6.9);

      // S4 (7.13 s): red banner slides down from the top; code line fades in under it (~10.2 s, "line of code").
      tl.to("#in-banner", { y: 0, duration: 0.6, ease: "power3.out" }, 7.13);
      tl.to("#in-code", { opacity: 1, duration: 0.5, ease: "power2.out" }, 10.2);

      // Pin to the full scene length (hold, no exit animation).
      tl.to({}, { duration: DUR }, 0);

      window.__timelines["intro"] = tl;
    })();
  </script>
