<template>
  <style>
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "JetBrains Mono"; src: url("../../assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1420;
      color: #eef1f7;
      font-family: "Inter", sans-serif;
    }
    .p1-ground { position: absolute; inset: 0; background: #0f1420; }
    .p1-svg-wrap { position: absolute; inset: 0; }
    .p1-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .p1-ring { fill: none; stroke: #7fd6e6; stroke-width: 4; opacity: 0; }
    .p1-wave { fill: none; stroke: #c3b1f2; stroke-width: 4; opacity: 0; }
    .p1-edge { fill: none; stroke: #c3b1f2; stroke-opacity: 0.5; stroke-width: 3; opacity: 0; }
    .p1-dot { fill: #8ab8ff; opacity: 0; }
    .p1-tw { position: absolute; inset: 0; }
    .p1-term {
      position: absolute;
      left: 0;
      right: 0;
      top: 330px;
      text-align: center;
      opacity: 0;
    }
    .p1-csi {
      font-family: "JetBrains Mono", monospace;
      font-size: 96px;
      color: #8ab8ff;
      line-height: 1.1;
    }
    .p1-def {
      margin-top: 28px;
      font-size: 56px;
      line-height: 1.25;
      color: #eef1f7;
    }
  </style>

  <div id="root" data-composition-id="a1-pond" data-start="0" data-duration="28.067" data-width="1920" data-height="1080">
    <div id="p1-ground" class="clip p1-ground" data-start="0" data-duration="28.067" data-track-index="0"></div>

    <div id="p1-svg-layer" class="clip p1-svg-wrap" data-start="0" data-duration="28.067" data-track-index="1">
      <svg id="p1-svg" class="p1-scene" viewBox="0 0 1920 1080" width="1920" height="1080">
        <defs>
          <clipPath id="p1-pondclip"><ellipse cx="960" cy="540" rx="620" ry="340"/></clipPath>
          <clipPath id="p1-roomclip"><rect x="210" y="190" width="1500" height="700"/></clipPath>
        </defs>

        <!-- pond shape that morphs into the room rectangle (points set by script) -->
        <path id="p1-shape" d="" fill="#123a41" stroke="#1f5c66" stroke-width="4" opacity="0"/>

        <!-- S0-S2: pond, stone, ripples, reeds, far bank with eye -->
        <g id="p1-gpond" opacity="0">
          <g clip-path="url(#p1-pondclip)">
            <circle class="p1-ring" cx="960" cy="540" r="0"/>
            <circle class="p1-ring" cx="960" cy="540" r="0"/>
            <circle class="p1-ring" cx="960" cy="540" r="0"/>
            <circle class="p1-ring" cx="960" cy="540" r="0"/>
            <circle class="p1-refl" cx="1280" cy="380" r="0" fill="none" stroke="#7fd6e6" stroke-width="4" opacity="0"/>
            <circle class="p1-refl" cx="640" cy="700" r="0" fill="none" stroke="#7fd6e6" stroke-width="4" opacity="0"/>
          </g>
          <!-- reeds -->
          <g stroke="#a9b3c6" stroke-width="5" stroke-linecap="round">
            <line x1="1280" y1="440" x2="1280" y2="335"/>
            <line x1="640" y1="760" x2="640" y2="655"/>
          </g>
          <ellipse cx="1280" cy="326" rx="9" ry="24" fill="#5d6a82"/>
          <ellipse cx="640" cy="646" rx="9" ry="24" fill="#5d6a82"/>
          <!-- stone -->
          <circle id="p1-stone" cx="960" cy="150" r="16" fill="#eef1f7" opacity="0"/>
        </g>

        <!-- S2: far bank, eye and arriving-ripple wiggle -->
        <g id="p1-gbank" opacity="0">
          <rect x="300" y="170" width="1320" height="20" fill="#1b2436"/>
          <path d="M700,120 Q760,62 820,120 Q760,178 700,120 Z" fill="none" stroke="#eef1f7" stroke-width="4"/>
          <circle cx="760" cy="120" r="14" fill="#eef1f7"/>
          <path id="p1-wig" d="" fill="none" stroke="#8ab8ff" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <!-- S3: radio waves inside the room (clipped to the room rectangle) -->
        <g id="p1-gwave">
          <g clip-path="url(#p1-roomclip)">
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
            <circle class="p1-wave" cx="360" cy="540" r="0"/>
          </g>
          <circle cx="360" cy="540" r="10" fill="#c3b1f2"/>
        </g>

        <!-- S4-S6: three boards, message dots, a person, the CSI meter -->
        <g id="p1-gtri" opacity="0">
          <g transform="translate(960 540) scale(1.5) translate(-960 -540)">
          <path id="p1-e0" class="p1-edge" d=""/>
          <path id="p1-e1" class="p1-edge" d=""/>
          <path id="p1-e2" class="p1-edge" d=""/>

          <circle id="p1-d0" class="p1-dot" r="9" cx="0" cy="0"/>
          <circle id="p1-d1" class="p1-dot" r="9" cx="0" cy="0"/>
          <circle id="p1-d2" class="p1-dot" r="9" cx="0" cy="0"/>
          <circle id="p1-d3" class="p1-dot" r="9" cx="0" cy="0"/>
          <circle id="p1-d4" class="p1-dot" r="9" cx="0" cy="0"/>
          <circle id="p1-d5" class="p1-dot" r="9" cx="0" cy="0"/>

          <g transform="translate(820,430)">
            <line x1="0" y1="-40" x2="0" y2="-72" stroke="#c3b1f2" stroke-width="3"/>
            <circle cx="0" cy="-76" r="6" fill="#c3b1f2"/>
            <rect x="-55" y="-40" width="110" height="80" rx="16" fill="#182133" stroke="#c3b1f2" stroke-width="3"/>
          </g>
          <g transform="translate(1100,430)">
            <line x1="0" y1="-40" x2="0" y2="-72" stroke="#c3b1f2" stroke-width="3"/>
            <circle cx="0" cy="-76" r="6" fill="#c3b1f2"/>
            <rect x="-55" y="-40" width="110" height="80" rx="16" fill="#182133" stroke="#c3b1f2" stroke-width="3"/>
          </g>
          <g transform="translate(960,700)">
            <line x1="0" y1="-40" x2="0" y2="-72" stroke="#c3b1f2" stroke-width="3"/>
            <circle cx="0" cy="-76" r="6" fill="#c3b1f2"/>
            <rect x="-55" y="-40" width="110" height="80" rx="16" fill="#182133" stroke="#c3b1f2" stroke-width="3"/>
          </g>

          <!-- person: feet at (0,0), walks in from the right (x set by script) -->
          <g id="p1-person" opacity="0">
            <g transform="scale(0.6)" fill="none" stroke="#eef1f7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="0" cy="-200" r="28"/>
              <path d="M0,-170 L0,-80 M0,-150 L-26,-100 M0,-150 L26,-100 M0,-80 L-22,0 M0,-80 L22,0"/>
            </g>
          </g>

          <!-- CSI meter next to board B -->
          <g id="p1-meter" opacity="0">
            <rect x="1180" y="350" width="260" height="120" rx="16" fill="#182133" stroke="#2a3448" stroke-width="3"/>
            <text x="1210" y="398" font-family="Inter" font-weight="400" font-size="44" fill="#a9b3c6">received</text>
            <path id="p1-wig2" d="" fill="none" stroke="#7fd6e6" stroke-width="4" stroke-linejoin="round"/>
          </g>
          </g>
        </g>
      </svg>
    </div>

    <div id="p1-tw-layer" class="clip p1-tw" data-start="0" data-duration="28.067" data-track-index="2">
      <div id="p1-term" class="p1-term">
        <div class="p1-csi">CSI</div>
        <div class="p1-def">= the radio's report of how each wave arrived</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 28.067;
      var tl = gsap.timeline({ paused: true });

      var CX = 960, CY = 540, RX = 620, RY = 340, HW = 750, HH = 350, N = 144;

      // Morph: sample N points around the pond ellipse and the room rectangle along the same rays.
      function morphD(k) {
        var out = [];
        for (var i = 0; i < N; i++) {
          var th = (2 * Math.PI * i) / N;
          var c = Math.cos(th), s = Math.sin(th);
          var ex = CX + RX * c, ey = CY + RY * s;
          var sx = Math.abs(c) > 1e-9 ? HW / Math.abs(c) : Infinity;
          var sy = Math.abs(s) > 1e-9 ? HH / Math.abs(s) : Infinity;
          var sc = Math.min(sx, sy);
          var rx = CX + c * sc, ry = CY + s * sc;
          var x = ex + (rx - ex) * k, y = ey + (ry - ey) * k;
          out.push((i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2));
        }
        return out.join(" ") + " Z";
      }

      // Wiggly line: amplitude a scales a fixed deterministic shape.
      function wigD(x0, y0, len, amp, a) {
        var d = "M" + x0 + "," + y0;
        for (var k = 1; k <= 60; k++) {
          var x = x0 + (len * k) / 60;
          var y = y0 - amp * a * (Math.sin(k * 0.9) + 0.6 * Math.sin(k * 2.7));
          d += " L" + x.toFixed(2) + "," + y.toFixed(2);
        }
        return d;
      }

      // Triangle edges: quadratic curves; "bend" pushes each control point toward the body.
      var P = [
        { a: [820, 430], b: [1100, 430] },
        { a: [1100, 430], b: [960, 700] },
        { a: [960, 700], b: [820, 430] }
      ];
      var PUSH = [
        [0, 110],
        [-47, -17],
        [47, -17]
      ];
      var bend = { k: 0 };
      function edgePt(e, t) {
        var p0 = P[e].a, p1 = P[e].b;
        var mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
        var cx = mx + PUSH[e][0] * bend.k, cy = my + PUSH[e][1] * bend.k;
        var u = 1 - t;
        return [
          u * u * p0[0] + 2 * u * t * cx + t * t * p1[0],
          u * u * p0[1] + 2 * u * t * cy + t * t * p1[1]
        ];
      }
      function edgeD(e) {
        var p0 = P[e].a, p1 = P[e].b;
        var mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
        var cx = mx + PUSH[e][0] * bend.k, cy = my + PUSH[e][1] * bend.k;
        return "M" + p0[0] + "," + p0[1] + " Q" + cx + "," + cy + " " + p1[0] + "," + p1[1];
      }
      function updateEdges() {
        for (var e = 0; e < 3; e++) {
          document.getElementById("p1-e" + e).setAttribute("d", edgeD(e));
        }
      }

      // Initial placement and shapes (not timed).
      document.getElementById("p1-shape").setAttribute("d", morphD(0));
      document.getElementById("p1-wig").setAttribute("d", wigD(880, 120, 580, 26, 0));
      document.getElementById("p1-wig2").setAttribute("d", wigD(1200, 440, 220, 26, 0.1));
      updateEdges();
      gsap.set("#p1-stone", { y: 0 });
      gsap.set("#p1-person", { x: 1320, y: 620 });
      gsap.set("#p1-term", { opacity: 0 });

      // Pond fades in.
      tl.fromTo("#p1-shape", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#p1-gpond", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);

      // S1 (1.69 s): stone drops into the pond, splash at ~2.19 s, rings expand.
      tl.fromTo("#p1-stone", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.6);
      tl.to("#p1-stone", { y: 390, duration: 0.5, ease: "power2.in" }, 1.69);
      tl.to("#p1-stone", { opacity: 0, duration: 0.05 }, 2.19);
      var rings = document.querySelectorAll(".p1-ring");
      rings.forEach(function (r, i) {
        tl.fromTo(r, { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 700 }, opacity: 0, duration: 2.4, ease: "power1.out" }, 2.19 + i * 0.5);
      });
      // Ripples bounce off the two reeds (reflected rings start ~3.6 s).
      var refl = document.querySelectorAll(".p1-refl");
      refl.forEach(function (r) {
        tl.fromTo(r, { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 260 }, opacity: 0, duration: 1.8, ease: "power1.out" }, 3.6);
      });

      // S2 (5.84 s): far bank with eye; arriving ripples drawn as a wiggly line.
      tl.fromTo("#p1-gbank", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.84);
      var wig = { a: 0 };
      tl.to(wig, {
        a: 1,
        duration: 2.0,
        ease: "power1.out",
        onUpdate: function () {
          document.getElementById("p1-wig").setAttribute("d", wigD(880, 120, 580, 26, wig.a));
        }
      }, 6.5);

      // Pond items leave before the morph (10.4 s).
      tl.to("#p1-gpond", { opacity: 0, duration: 0.5, ease: "power1.in" }, 10.4);
      tl.to("#p1-gbank", { opacity: 0, duration: 0.5, ease: "power1.in" }, 10.4);

      // S3 (10.61 s): pond morphs into the room rectangle; fill follows.
      var morph = { k: 0 };
      tl.to(morph, {
        k: 1,
        duration: 1.6,
        ease: "power2.inOut",
        onUpdate: function () {
          document.getElementById("p1-shape").setAttribute("d", morphD(morph.k));
        }
      }, 10.61);
      tl.to("#p1-shape", { fill: "#182133", stroke: "#2a3448", duration: 1.6, ease: "power2.inOut" }, 10.61);

      // Violet radio waves from a source inside the room (11.3 s onward), gone by 13.2 s.
      var waves = document.querySelectorAll(".p1-wave");
      waves.forEach(function (w, i) {
        tl.fromTo(w, { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 700 }, opacity: 0, duration: 2.6, ease: "power1.out" }, 11.3 + i * 0.4);
      });
      tl.to("#p1-gwave", { opacity: 0, duration: 0.6, ease: "power1.in" }, 13.2);

      // S4 (13.32 s): three boards, edges and message dots fly both ways.
      tl.fromTo("#p1-gtri", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 13.32);
      tl.fromTo(".p1-edge", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 13.5);

      var dotSpecs = [
        { id: "p1-d0", e: 0, dir: 1, start: 13.9 },
        { id: "p1-d1", e: 0, dir: -1, start: 14.15 },
        { id: "p1-d2", e: 1, dir: 1, start: 14.4 },
        { id: "p1-d3", e: 1, dir: -1, start: 14.65 },
        { id: "p1-d4", e: 2, dir: 1, start: 14.9 },
        { id: "p1-d5", e: 2, dir: -1, start: 15.15 }
      ];
      dotSpecs.forEach(function (s) {
        var dot = document.getElementById(s.id);
        var pr = { t: 0 };
        function place() {
          var t = s.dir > 0 ? pr.t : 1 - pr.t;
          var p = edgePt(s.e, t);
          dot.setAttribute("cx", p[0].toFixed(2));
          dot.setAttribute("cy", p[1].toFixed(2));
        }
        place();
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.2 }, s.start);
        tl.fromTo(pr, { t: 0 }, { t: 1, duration: 1.4, ease: "none", repeat: 6, onUpdate: place }, s.start);
      });

      // S5 (16.6 s): meter appears next to board B and starts wobbling; a body walks into the triangle.
      tl.to("#p1-meter", { opacity: 1, duration: 0.5, ease: "power2.out" }, 16.3);
      var meter = { a: 0.1 };
      tl.to(meter, {
        a: 0.6,
        duration: 1.8,
        ease: "power1.inOut",
        onUpdate: function () {
          document.getElementById("p1-wig2").setAttribute("d", wigD(1200, 440, 220, 26, meter.a));
        }
      }, 16.6);
      tl.fromTo("#p1-person", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.3);
      tl.to("#p1-person", { x: 960, duration: 1.6, ease: "power1.inOut" }, 16.6);
      // Waves bend around the body (17.0 s).
      tl.to(bend, { k: 1, duration: 0.9, ease: "power2.inOut", onUpdate: updateEdges }, 17.0);

      // S6 (20.33 s): person fades to 20%; meter line enlarges on "We watch the ripples wobble" (22.13 s).
      tl.to("#p1-person", { opacity: 0.2, duration: 0.6, ease: "power1.inOut" }, 20.33);
      tl.to(meter, {
        a: 1,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: function () {
          document.getElementById("p1-wig2").setAttribute("d", wigD(1200, 440, 220, 26, meter.a));
        }
      }, 22.13);

      // S7 (24.07 s): scene fades out; CSI term card appears.
      tl.to("#p1-svg", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.9);
      tl.fromTo("#p1-term", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 24.07);

      // Pin to the full scene length (hold, no exit animation).
      tl.to({}, { duration: DUR }, 0);

      window.__timelines["a1-pond"] = tl;
    })();
  </script>
</template>
