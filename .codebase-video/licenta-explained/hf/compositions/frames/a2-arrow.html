<template>
  <style>

    @font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1420; }
    .ar-stage { position: absolute; inset: 0; background: #0f1420; }
    .ar-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ar-stage text { font-family: "Inter", sans-serif; fill: #eef1f7; }
    .ar-stage .mono { font-family: "JetBrains Mono", monospace; }

  <div id="root" data-composition-id="a2-arrow" data-start="0" data-duration="19.4" data-width="1920" data-height="1080">
    <div id="ar-stage" class="clip ar-stage" data-start="0" data-duration="19.4" data-track-index="0">
      <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <!-- Scene 0: the two numbers -->
        <text id="ar-q" x="960" y="230" font-size="72" font-weight="700" text-anchor="middle" style="opacity:0">Why two numbers per reading?</text>
        <g id="ar-tile-a" style="opacity:0">
          <rect x="660" y="380" width="240" height="150" rx="16" fill="#182133" stroke="#2a3448" stroke-width="2"/>
          <text class="mono" x="780" y="482" font-size="96" text-anchor="middle">30</text>
        </g>
        <g id="ar-tile-b" style="opacity:0">
          <rect x="1040" y="380" width="240" height="150" rx="16" fill="#182133" stroke="#2a3448" stroke-width="2"/>
          <text class="mono" x="1160" y="482" font-size="96" text-anchor="middle">&#8722;40</text>
        </g>

        <!-- Graph paper, origin at (640, 260), 14 px per unit, 70 px grid -->
        <g id="ar-grid" style="opacity:0"></g>
        <circle id="ar-origin" cx="640" cy="260" r="9" fill="#eef1f7" style="opacity:0"/>

        <!-- Scene 2: 30 right, 40 down, then the arrow -->
        <line id="ar-h" x1="640" y1="260" x2="640" y2="260" stroke="#a9b3c6" stroke-width="4" stroke-dasharray="12 10"/>
        <text id="ar-lab-30" x="850" y="200" font-size="44" text-anchor="middle" style="opacity:0">30 right</text>
        <line id="ar-v" x1="1060" y1="260" x2="1060" y2="260" stroke="#a9b3c6" stroke-width="4" stroke-dasharray="12 10"/>
        <text id="ar-lab-40" x="1100" y="545" font-size="44" style="opacity:0">40 down</text>
        <line id="ar-hyp" x1="640" y1="260" x2="1060" y2="820" stroke="#8ab8ff" stroke-width="12" stroke-dasharray="700 700" stroke-dashoffset="700"/>
        <polygon id="ar-head" points="1060,820 1024,802 1052.8,780.4" fill="#8ab8ff" style="opacity:0"/>

        <!-- Scene 3: the 3-4-5 triangle -->
        <polygon id="ar-tri" points="640,260 1060,260 1060,820" fill="#8ab8ff" style="opacity:0"/>
        <path id="ar-rt" d="M1036 260 L1036 284 L1060 284" fill="none" stroke="#8ab8ff" stroke-width="4" style="opacity:0"/>
        <text id="ar-l50" x="790" y="520" font-size="56" font-weight="700" fill="#8ab8ff" text-anchor="middle" style="opacity:0">50</text>
        <text id="ar-note" class="mono" x="1100" y="690" font-size="44" fill="#a9b3c6" style="opacity:0">3-4-5 &#215; 10</text>

        <!-- Scene 4: the length becomes a loudness bar -->
        <line id="ar-bar" x1="1500" y1="230" x2="1500" y2="230" stroke="#8ab8ff" stroke-width="70" style="opacity:0"/>

          <line x1="830" y1="300" x2="770" y2="360"/>

  </div>

  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var tl = gsap.timeline({ paused: true });

      // Graph paper aligned to the origin (640, 260), grid step 70 px (5 units).
      var grid = document.getElementById("ar-grid");
      var k;
      for (k = -4; k <= 10; k++) {
        var vx = document.createElementNS(NS, "line");
        vx.setAttribute("x1", String(640 + 70 * k));
        vx.setAttribute("x2", String(640 + 70 * k));
        vx.setAttribute("y1", "120");
        vx.setAttribute("y2", "890");
        vx.setAttribute("stroke", "#2a3448");
        vx.setAttribute("stroke-width", "2");
        grid.appendChild(vx);
      }
      for (k = -2; k <= 9; k++) {
        var hy = document.createElementNS(NS, "line");
        hy.setAttribute("x1", "360");
        hy.setAttribute("x2", "1340");
        hy.setAttribute("y1", String(260 + 70 * k));
        hy.setAttribute("y2", String(260 + 70 * k));
        hy.setAttribute("stroke", "#2a3448");
        hy.setAttribute("stroke-width", "2");
        grid.appendChild(hy);
      }

      // Scene 0 (0.2-2.1): the two numbers, then they leave for the grid.
      tl.fromTo("#ar-q", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#ar-tile-a", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);
      tl.fromTo("#ar-tile-b", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.to(["#ar-q", "#ar-tile-a", "#ar-tile-b"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.1);

      // Scene 1 (2.13-4.5): graph paper fades in, origin dot appears.
      tl.to("#ar-grid", { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.13);
      tl.to("#ar-origin", { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // Scene 2 (4.92-9.57): 30 right, then 40 down, then the arrow.
      tl.fromTo("#ar-h", { attr: { x2: 640 } }, { attr: { x2: 1060 }, duration: 0.8, ease: "power2.inOut" }, 4.92);
      tl.to("#ar-lab-30", { opacity: 1, duration: 0.5, ease: "power1.out" }, 5.6);
      tl.fromTo("#ar-v", { attr: { y2: 260 } }, { attr: { y2: 820 }, duration: 0.8, ease: "power2.inOut" }, 5.8);
      tl.to("#ar-lab-40", { opacity: 1, duration: 0.5, ease: "power1.out" }, 6.5);
      tl.fromTo("#ar-hyp", { strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 7.5);
      tl.to("#ar-head", { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.4);
      tl.to("#ar-angle", { opacity: 1, duration: 0.5, ease: "power1.out" }, 8.6);

      // Scene 3 (9.99-14.1): the 3-4-5 triangle and the length 50.
      tl.to("#ar-tri", { opacity: 0.16, duration: 0.8, ease: "power1.out" }, 10.0);
      tl.to("#ar-rt", { opacity: 1, duration: 0.4, ease: "power1.out" }, 10.2);
      tl.to("#ar-l50", { opacity: 1, duration: 0.5, ease: "power1.out" }, 10.6);
      tl.to("#ar-note", { opacity: 1, duration: 0.5, ease: "power1.out" }, 10.9);

      // Scene 4 (14.53-16.8): the grid steps back, a bar of the same length grows.
      tl.to(["#ar-tri", "#ar-rt", "#ar-l50", "#ar-note"], { opacity: 0, duration: 0.6, ease: "power1.in" }, 14.53);
      tl.to("#ar-grid", { opacity: 0.3, duration: 0.8, ease: "power2.inOut" }, 14.53);
      tl.set("#ar-bar", { opacity: 1 }, 14.7);
      tl.fromTo("#ar-bar", { attr: { y2: 230 } }, { attr: { y2: 930 }, duration: 1.0, ease: "power2.inOut" }, 14.7);
      tl.to("#ar-bar-lab", { opacity: 1, duration: 0.5, ease: "power1.out" }, 15.4);

      // Scene 5 (17.23-19.17): the angle marker fades and gets a muted cross.
      tl.to("#ar-angle", { opacity: 0, duration: 0.5, ease: "power1.in" }, 17.23);
      tl.to("#ar-x", { opacity: 1, duration: 0.5, ease: "power1.out" }, 17.4);

      // Pin the timeline to the full scene length (hold, no exit).
      tl.to({}, { duration: 19.4 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["a2-arrow"] = tl;
    })();
  </script>
