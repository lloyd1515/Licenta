<text x="52" y="359" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >Amplitudinea A = lungimea vectorului (I, Q) pe o sub-frecvență. Puterea P ∝ A².</text>
<text x="52" y="381" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >Un obstacol atenuează semnalul → amplitudinea scade (vectorul (I,Q) se apropie de origine).</text>
<text x="52" y="403" font-size="13" text-anchor="start" font-style="italic" font-weight="normal" fill="#555">Surse: Wikipedia, In-phase and quadrature components; Wang et al., 2015 (CARM).</text>
