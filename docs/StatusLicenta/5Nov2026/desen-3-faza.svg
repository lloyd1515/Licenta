<text x="52" y="359" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >Faza = decalajul unghiular al undei: Δθ = 2π·Δd/λ = 2πf·Δτ.</text>
<text x="52" y="381" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >Mișcarea schimbă lungimea căii → se schimbă unghiul (și amplitudinea sumei căilor).</text>
