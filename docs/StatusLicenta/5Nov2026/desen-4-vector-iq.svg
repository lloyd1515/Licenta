<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#1a237e"/>
  </marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#1a237e" stroke-width="2"/>
  </pattern>
</defs>
<rect width="640" height="720" fill="#ffffff"/>
<text x="320" y="34" font-size="22" text-anchor="middle" font-weight="bold" fill="#1a237e" >2. Vectorul (I, Q)</text>
<line x1="80" y1="500" x2="580" y2="500" stroke="#1a237e" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="110" y1="530" x2="110" y2="70" stroke="#1a237e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="585" y="522" font-size="17" text-anchor="start" font-weight="normal" fill="#1a237e" >I (Ox)</text>
<text x="120" y="70" font-size="17" text-anchor="start" font-weight="normal" fill="#1a237e" >Q (Oy)</text>
<text x="88" y="522" font-size="20" text-anchor="middle" font-weight="bold" fill="#1a237e" >O</text>
<line x1="264.9" y1="208.6" x2="264.9" y2="500" stroke="#1a237e" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="264.9" y1="208.6" x2="110" y2="208.6" stroke="#1a237e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="264.925615719344" y="524" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a237e" >I</text>
<text x="96" y="214.6272943565541" font-size="18" text-anchor="end" font-weight="bold" fill="#1a237e" >Q</text>
<path d="M432.8 431.4 A330 330 0 0 0 121.5 170.2" fill="none" stroke="#9fa8da" stroke-width="2" stroke-dasharray="3 5"/>
<line x1="110" y1="500" x2="264.9" y2="208.6" stroke="#1a237e" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="264.9" cy="208.6" r="6" fill="#1a237e"/>
<text x="278.925615719344" y="200.6272943565541" font-size="18" text-anchor="start" font-weight="bold" fill="#1a237e" >(I, Q)</text>
<text x="214" y="276" font-size="18" text-anchor="end" font-weight="bold" fill="#1a237e" >A (ρ)</text>
<path d="M180 500 A70 70 0 0 0 142.9 438.2" fill="none" stroke="#c62828" stroke-width="2.5"/>
<text x="192" y="474" font-size="22" text-anchor="start" font-weight="bold" fill="#c62828" >θ</text>
<circle cx="189.8" cy="349.9" r="6" fill="#c62828"/>
<line x1="197" y1="349.9" x2="274" y2="349.9" stroke="#c62828" stroke-width="1.2"/>
<text x="280" y="347" font-size="15" text-anchor="start" font-weight="normal" fill="#c62828" >după atenuare:</text>
<text x="280" y="365" font-size="15" text-anchor="start" font-weight="normal" fill="#c62828" >același unghi,</text>
<text x="280" y="383" font-size="15" text-anchor="start" font-weight="normal" fill="#c62828" >A mai mică</text>
<rect x="30" y="580" width="580" height="106" rx="6" fill="#f3f4fb" stroke="#c5cae9"/>
<text x="42" y="604" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >I = proiecția vectorului pe Ox, Q = proiecția pe Oy → (I, Q) descrie starea undei.</text>
<text x="42" y="626" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >A = √(I²+Q²) = distanța față de origine; θ = arctan2(Q, I) = unghiul.</text>
<text x="42" y="648" font-size="15" text-anchor="start" font-weight="normal" fill="#333" >Atenuarea apropie vectorul de origine. Mișcarea schimbă unghiul și amplitudinea.</text>
<text x="42" y="672" font-size="13" text-anchor="start" font-style="italic" font-weight="normal" fill="#555">Surse: Wikipedia, In-phase and quadrature components; Zeng et al., 2019 (FarSense).</text>
</svg>
